[workspace]
members = [
  "crates/metasearch",
  "crates/scorch-api",
  "crates/scorch-cli",
  "crates/scorch-engine",
  "crates/scorch-server",
  "crates/scorch-types",
]
default-members = ["crates/scorch-cli"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
authors = ["Fractal-Tess <vgfractal@gmail.com>"]
license = "MIT"
repository = "https://github.com/Fractal-Tess/scorch"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dashmap = "6.2.1"
dom_smoothie = "0.18.0"
futures-util = "0.3.33"
htmd = "0.5.5"
httpdate = "1.0.3"
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura.git", rev = "f458a7f23d4a9827f8be993c6340ef829211623c", features = ["stealth"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-io"] }
robotstxt = "0.3.0"
schemars = { version = "1.2.2", features = ["uuid1"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

# Obscura fetches `<script src>` and ES modules over its plain HTTP client while
# fetching the document, stylesheets, and images over its stealth client. The two
# clients hold separate connection pools, so every render paid a second TCP and
# TLS handshake to its own origin, and subresources carried a different TLS
# fingerprint than the navigation that requested them. The fork routes both over
# the page's own client, re-exports its stealth types for the slot pool, gives
# the stealth transport the same bounded script cache/singleflight policy as the
# plain transport, and retains the earlier response-handoff API in the pinned
# fork. Remove this patch once all four changes land upstream.
[patch."https://github.com/h4ckf0r0day/obscura.git"]
obscura-browser = { git = "https://github.com/Fractal-Tess/obscura.git", rev = "a0831a5c86493d53824d84793938010112fffab3" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.release-debug]
inherits = "release"
debug = 1
strip = "none"

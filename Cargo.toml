[workspace]
members = [
  "crates/scorch-api",
  "crates/scorch-cli",
  "crates/scorch-engine",
  "crates/scorch-types",
]
default-members = ["crates/scorch-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Fractal-Tess <vgfractal@gmail.com>"]
license = "MIT"
repository = "https://github.com/Fractal-Tess/scorch"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dashmap = "6.1.0"
dom_smoothie = "0.18.0"
futures-util = "0.3.33"
html2md = "0.2.15"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-io"] }
robotstxt = "0.3.0"
schemars = { version = "1.2.2", features = ["uuid1"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.26.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true

[profile.release-debug]
inherits = "release"
debug = 1
strip = "none"

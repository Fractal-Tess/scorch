name: Publish prepared release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      run_id:
        description: Successful Prepare release binaries workflow run ID
        required: true
        type: string
      target:
        description: Exact commit SHA for the release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish exact prepared artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Validate preparation run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          conclusion="$(jq -r .conclusion <<<"${run}")"
          event="$(jq -r .event <<<"${run}")"
          workflow_id="$(jq -r .workflow_id <<<"${run}")"
          workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq .path)"
          if [[ "${conclusion}" != "success" || "${event}" != "workflow_dispatch" ]]; then
            echo "preparation run ${RUN_ID} is not a successful dispatch: ${conclusion}/${event}" >&2
            exit 1
          fi
          if [[ "${workflow_path}" != ".github/workflows/release.yml" ]]; then
            echo "run ${RUN_ID} used unexpected workflow ${workflow_path}" >&2
            exit 1
          fi

      - name: Download exact prepared archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scorch-v${{ inputs.version }}-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Download source manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scorch-v${{ inputs.version }}-manifest
          path: manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Verify source and archive checksums
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          sh -n manifest/install.sh
          jq --exit-status \
            --arg version "${VERSION}" \
            --arg sourceSha "${TARGET}" \
            '.version == $version and .sourceSha == $sourceSha and .rustVersion == "1.97.1"' \
            manifest/release-manifest.json >/dev/null
          expected=(
            "scorch-v${VERSION}-aarch64-unknown-linux-gnu.tar.xz"
            "scorch-v${VERSION}-x86_64-unknown-linux-gnu.tar.xz"
          )
          test "$(find dist -maxdepth 1 -name '*.tar.xz' -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 2
          for archive in "${expected[@]}"; do
            test -f "dist/${archive}"
            test -f "dist/${archive}.sha256"
            (cd dist && sha256sum --check --strict "${archive}.sha256")
          done

      - name: Create release and upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET}" \
            --title "Scorch ${tag}" \
            --generate-notes \
            --draft \
            dist/*.tar.xz \
            dist/*.sha256 \
            manifest/install.sh
          gh release edit "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

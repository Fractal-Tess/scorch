name: Publish prepared release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      run_id:
        description: Successful Prepare release binaries workflow run ID
        required: true
        type: string
      target:
        description: Exact commit SHA for the release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  publish:
    name: Publish exact prepared artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Validate preparation run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          conclusion="$(jq -r .conclusion <<<"${run}")"
          event="$(jq -r .event <<<"${run}")"
          workflow_id="$(jq -r .workflow_id <<<"${run}")"
          workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq .path)"
          if [[ "${conclusion}" != "success" || "${event}" != "workflow_dispatch" ]]; then
            echo "preparation run ${RUN_ID} is not a successful dispatch: ${conclusion}/${event}" >&2
            exit 1
          fi
          if [[ "${workflow_path}" != ".github/workflows/release.yml" ]]; then
            echo "run ${RUN_ID} used unexpected workflow ${workflow_path}" >&2
            exit 1
          fi

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists; refusing to replace its assets or image" >&2
            exit 1
          fi

      - name: Check out the exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.target }}
          persist-credentials: false

      - name: Download exact prepared archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: scorch-v${{ inputs.version }}-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Download source manifest
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: scorch-v${{ inputs.version }}-manifest
          path: manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Verify source and archive checksums
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          sh -n manifest/install.sh
          jq --exit-status \
            --arg version "${VERSION}" \
            --arg sourceSha "${TARGET}" \
            '.version == $version and .sourceSha == $sourceSha and .rustVersion == "1.97.1"' \
            manifest/release-manifest.json >/dev/null
          targets=(
            "aarch64-unknown-linux-gnu"
            "x86_64-unknown-linux-gnu"
          )
          test "$(find dist -maxdepth 1 -name '*.tar.xz' -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 6
          for target in "${targets[@]}"; do
            assets=(
              "scorch-v${VERSION}-${target}.tar.xz"
              "scorch-${target}"
              "scorchd-${target}"
            )
            for asset in "${assets[@]}"; do
              test -f "dist/${asset}"
              test -f "dist/${asset}.sha256"
              (cd dist && sha256sum --check --strict "${asset}.sha256")
            done
          done

      - name: Download scratch image inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: scorch-v${{ inputs.version }}-docker-*
          path: image-context
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify prepared image input
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          cmp dist/scorch-x86_64-unknown-linux-gnu image-context/docker/amd64/scorch
          cmp dist/scorchd-x86_64-unknown-linux-gnu image-context/docker/amd64/scorchd
          cmp dist/scorch-aarch64-unknown-linux-gnu image-context/docker/arm64/scorch
          cmp dist/scorchd-aarch64-unknown-linux-gnu image-context/docker/arm64/scorchd
          test "$(image-context/docker/amd64/scorch --version)" = "scorch ${VERSION}"
          test "$(image-context/docker/amd64/scorchd --version)" = "scorchd ${VERSION}"
          grep -F -- 'FROM scratch' image-context/Dockerfile
          grep -F -- "${TARGET}" manifest/release-manifest.json

      - name: Create draft release with immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET}" \
            --title "Scorch ${tag}" \
            --generate-notes \
            --draft \
            dist/*.tar.xz \
            dist/*.sha256 \
            dist/scorch-*-linux-gnu \
            dist/scorchd-*-linux-gnu \
            manifest/install.sh

      - name: Build and publish multi-platform scratch image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image-context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ inputs.target }}
          tags: |
            ghcr.io/fractal-tess/scorch:${{ inputs.version }}
            ghcr.io/fractal-tess/scorch:${{ inputs.target }}
            ghcr.io/fractal-tess/scorch:latest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          gh release edit "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

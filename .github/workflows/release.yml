name: Release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          package_version="$(sed -n '/^\[workspace.package\]/,/^$/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "${version}" != "${package_version}" ]]; then
            echo "requested version ${version} does not match workspace version ${package_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake git libclang-dev perl pkg-config xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            -p scorch-cli \
            -p scorch-server

      - name: Package deterministic archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="scorch-v${VERSION}-${TARGET}.tar.xz"
          root="dist/scorch-v${VERSION}-${TARGET}"
          install -Dm755 "target/${TARGET}/release/scorch" "${root}/bin/scorch"
          install -Dm755 "target/${TARGET}/release/scorchd" "${root}/bin/scorchd"
          install -Dm644 LICENSE "${root}/share/licenses/scorch/LICENSE"
          install -Dm644 README.md "${root}/share/doc/scorch/README.md"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cJf "dist/${archive}" \
            "scorch-v${VERSION}-${TARGET}"
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"
          rm -rf "${root}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorch-v${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: scorch-*
          path: dist
          merge-multiple: true

      - name: Upload versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Scorch ${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/*.tar.xz \
            dist/*.sha256

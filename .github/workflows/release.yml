name: Prepare release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record immutable revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            v8_sha256: a2681fde53018abd3366018f132617dd598002df78f156c7bc6d2ff608b56567
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            v8_sha256: e368d0cb41c179c43a990e4ec4a55e44dd9762f1d34be15696acc4433f8a6c92
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out resolved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Verify version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package_version="$(sed -n '/^\[workspace.package\]/,/^$/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "${VERSION}" != "${package_version}" ]]; then
            echo "requested version ${VERSION} does not match workspace version ${package_version}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake git libclang-dev perl pkg-config xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}

      - name: Fetch verified Rusty V8 archive
        env:
          TARGET: ${{ matrix.target }}
          V8_SHA256: ${{ matrix.v8_sha256 }}
        run: |
          archive="$RUNNER_TEMP/librusty_v8.a.gz"
          curl --fail --location --retry 5 \
            --output "${archive}" \
            "https://github.com/denoland/rusty_v8/releases/download/v137.3.0/librusty_v8_release_${TARGET}.a.gz"
          echo "${V8_SHA256}  ${archive}" | sha256sum --check --strict
          gzip -cd "${archive}" > "$RUNNER_TEMP/librusty_v8.a"

      - name: Build release binaries
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTY_V8_ARCHIVE: ${{ runner.temp }}/librusty_v8.a
        run: |
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            -p scorch-cli \
            -p scorch-server

      - name: Package deterministic archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="scorch-v${VERSION}-${TARGET}.tar.xz"
          root="dist/scorch-v${VERSION}-${TARGET}"
          install -Dm755 "target/${TARGET}/release/scorch" "${root}/bin/scorch"
          install -Dm755 "target/${TARGET}/release/scorchd" "${root}/bin/scorchd"
          install -Dm644 LICENSE "${root}/share/licenses/scorch/LICENSE"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cJf "dist/${archive}" \
            "scorch-v${VERSION}-${TARGET}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          rm -rf "${root}"

      - name: Upload prepared archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorch-v${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

name: Prepare release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record immutable revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create source manifest
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          jq --null-input \
            --arg version "${VERSION}" \
            --arg sourceSha "$(git rev-parse HEAD)" \
            --arg rustVersion "1.97.1" \
            '{version: $version, sourceSha: $sourceSha, rustVersion: $rustVersion}' \
            > release-manifest.json

      - name: Upload source manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorch-v${{ inputs.version }}-manifest
          path: |
            release-manifest.json
            install.sh
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            v8_sha256: a2681fde53018abd3366018f132617dd598002df78f156c7bc6d2ff608b56567
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            v8_sha256: e368d0cb41c179c43a990e4ec4a55e44dd9762f1d34be15696acc4433f8a6c92
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out resolved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Verify version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package_version="$(sed -n '/^\[workspace.package\]/,/^$/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "${VERSION}" != "${package_version}" ]]; then
            echo "requested version ${VERSION} does not match workspace version ${package_version}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake git libclang-dev perl pkg-config xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}

      - name: Fetch verified Rusty V8 archive
        env:
          TARGET: ${{ matrix.target }}
          V8_SHA256: ${{ matrix.v8_sha256 }}
        run: |
          archive="$RUNNER_TEMP/librusty_v8.a.gz"
          curl --fail --location --retry 5 \
            --output "${archive}" \
            "https://github.com/denoland/rusty_v8/releases/download/v137.3.0/librusty_v8_release_${TARGET}.a.gz"
          echo "${V8_SHA256}  ${archive}" | sha256sum --check --strict
          gzip -cd "${archive}" > "$RUNNER_TEMP/librusty_v8.a"

      - name: Verify source quality
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTY_V8_ARCHIVE: ${{ runner.temp }}/librusty_v8.a
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          sh -n install.sh

      - name: Verify dependency policy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check advisories licenses sources

      - name: Build release binaries
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTY_V8_ARCHIVE: ${{ runner.temp }}/librusty_v8.a
        run: |
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            -p scorch-cli \
            -p scorch-server

      - name: Verify Obscura-only command surfaces
        env:
          TARGET: ${{ matrix.target }}
        run: |
          server_help="$("target/${TARGET}/release/scorchd" --help)"
          client_help="$("target/${TARGET}/release/scorch" scrape --help)"
          if grep -Eiq -- 'chromium|--browser|--allowed-browsers|--browser-path' <<<"${server_help}"; then
            echo "scorchd still exposes a removed browser surface" >&2
            exit 1
          fi
          if grep -Eiq -- 'chromium|--browser|--render' <<<"${client_help}"; then
            echo "scorch still exposes a removed browser or render surface" >&2
            exit 1
          fi
          if grep -F -- '--obscura-stealth' <<<"${server_help}"; then
            echo "scorchd still exposes the fixed stealth policy" >&2
            exit 1
          fi

      - name: Package deterministic archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="scorch-v${VERSION}-${TARGET}.tar.xz"
          root="dist/scorch-v${VERSION}-${TARGET}"
          install -Dm755 "target/${TARGET}/release/scorch" "${root}/bin/scorch"
          install -Dm755 "target/${TARGET}/release/scorchd" "${root}/bin/scorchd"
          install -Dm644 LICENSE "${root}/share/licenses/scorch/LICENSE"
          install -Dm644 THIRD_PARTY_LICENSES.html \
            "${root}/share/licenses/scorch/THIRD_PARTY_LICENSES.html"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cJf "dist/${archive}" \
            "scorch-v${VERSION}-${TARGET}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          install -m755 "${root}/bin/scorch" "dist/scorch-${TARGET}"
          install -m755 "${root}/bin/scorchd" "dist/scorchd-${TARGET}"
          (cd dist && sha256sum "scorch-${TARGET}" > "scorch-${TARGET}.sha256")
          (cd dist && sha256sum "scorchd-${TARGET}" > "scorchd-${TARGET}.sha256")
          rm -rf "${root}"

      - name: Upload prepared archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorch-v${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
            dist/scorch-*
            dist/scorchd-*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare minimal scratch image filesystem
        env:
          TARGET_ARCH: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}
          TARGET: ${{ matrix.target }}
        run: |
          image="docker/${TARGET_ARCH}"
          root="${image}/rootfs"
          install -Dm755 "target/${TARGET}/release/scorch" "${image}/scorch"
          install -Dm755 "target/${TARGET}/release/scorchd" "${image}/scorchd"
          install -Dm644 /etc/ssl/certs/ca-certificates.crt \
            "${root}/etc/ssl/certs/ca-certificates.crt"
          install -d -m1777 "${root}/tmp"

          interpreter="$(readelf --program-headers "${image}/scorchd" \
            | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')"
          test -n "${interpreter}"
          install -Dm755 "$(readlink -f "${interpreter}")" "${root}${interpreter}"

          for binary in "${image}/scorch" "${image}/scorchd"; do
            ldd "${binary}" | awk '$2 == "=>" && $3 ~ /^\// { print $3 }' | while read -r library; do
              install -Dm755 "$(readlink -f "${library}")" "${root}/lib/$(basename "${library}")"
            done
          done

      - name: Upload scratch image input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorch-v${{ steps.version.outputs.version }}-docker-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}
          path: |
            Dockerfile
            docker/${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}
          if-no-files-found: error
          retention-days: 30

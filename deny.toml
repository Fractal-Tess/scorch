[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "transitive rusty_v8 dependency; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0057", reason = "transitive Obscura dependency; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0141", reason = "transitive deno_core dependency; no safe upgrade is available" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
crate = "obscura-browser@0.1.0"
expression = "Apache-2.0"
license-files = [{ path = "../../LICENSE", hash = 0x9f5e9993 }]

[[licenses.clarify]]
crate = "obscura-dom@0.1.0"
expression = "Apache-2.0"
license-files = [{ path = "../../LICENSE", hash = 0x9f5e9993 }]

[[licenses.clarify]]
crate = "obscura-js@0.1.0"
expression = "Apache-2.0"
license-files = [{ path = "../../LICENSE", hash = 0x9f5e9993 }]

[[licenses.clarify]]
crate = "obscura-net@0.1.0"
expression = "Apache-2.0"
license-files = [{ path = "../../LICENSE", hash = 0x9f5e9993 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Obscura resolves to a fork that fetches scripts and ES modules over the page's
# own client. Restore https://github.com/h4ckf0r0day/obscura.git here once the
# fix is upstream and the [patch] in Cargo.toml goes away.
allow-git = ["https://github.com/Fractal-Tess/obscura.git"]
